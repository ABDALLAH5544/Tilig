<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدار EDU — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B3D2E; --ink-deep:#082B21;
    --parchment:#F3EBD8; --parchment-soft:#FBF7EC;
    --gold:#C9A227; --line: rgba(201,162,39,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal', sans-serif;
    background: radial-gradient(circle at 20% 10%, #0E4A38 0%, var(--ink) 45%, var(--ink-deep) 100%);
    color: var(--parchment); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:440px; background:var(--parchment-soft); color:var(--ink-deep);
    border-radius:18px; padding:44px 36px 36px; text-align:center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px var(--line);
  }
  .eyebrow{ font-size:13px; letter-spacing:.08em; color:var(--gold); font-weight:700; margin-bottom:6px; }
  h1{ font-family:'Amiri', serif; font-size:34px; margin:0 0 8px; }
  h1 span{ color:#0E4A38; }
  .sub{ font-size:15px; line-height:1.7; color:#4a4536; margin:0 0 24px; }
  .bot-link{
    display:inline-flex; align-items:center; gap:8px; padding:14px 22px; border-radius:10px;
    background:var(--ink-deep); color:var(--parchment); text-decoration:none; font-weight:700;
    font-size:15px; transition:.15s;
  }
  .bot-link:hover{ background:#0E4A38; }
  .check-btn{
    margin-top:14px; width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--ink-deep); font-weight:700; font-size:14px; cursor:pointer;
    font-family:inherit;
  }
  .check-btn:hover{ background:rgba(201,162,39,0.1); }
  .status{ margin-top:20px; border-radius:12px; padding:16px; font-size:14px; line-height:1.8; display:none; }
  .status.show{ display:block; }
  .status.success{ background:#E9F3EA; border:1px solid #9CC9A1; color:#1D5C2A; }
  .status.pending{ background:#FBF3DE; border:1px solid #E4C158; color:#7A5B00; }
  .uid{ font-family:monospace; font-weight:700; background:rgba(0,0,0,0.06); padding:2px 8px; border-radius:6px; display:inline-block; margin-top:4px; }
  .foot{ margin-top:24px; font-size:12px; color:#8a8368; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">منصّة مدار التعليمية</div>
    <h1>مدار <span>EDU</span></h1>
    <p class="sub">اضغط الزر لفتح البوت، ثم اضغط Start، وارجع هنا واضغط "تحقق الآن".</p>

    <a id="botLink" class="bot-link" href="#" target="_blank" rel="noopener">فتح البوت</a>
    <button class="check-btn" id="checkBtn">تحقق الآن</button>

    <div id="status" class="status"></div>
    <div class="foot">لن نشارك بياناتك مع أي جهة خارجية</div>
  </div>

<script>
  // ⚠️ التوكن ده ظاهر لأي حد يفتح مصدر الصفحة — مناسب فقط لبوت تجربة بدون بيانات حساسة
  const BOT_TOKEN = "8471235916:AAE8QGuJPIz0z9gqzp6sx1FU4uCRRhTqGK4";
  const BOT_USERNAME = "Adbeln_bot";

  function makeSession() {
    let s = localStorage.getItem('madarEDU_session');
    if (!s) {
      s = 'v' + Date.now() + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('madarEDU_session', s);
    }
    return s;
  }

  const session = makeSession();
  document.getElementById('botLink').href = `https://t.me/${BOT_USERNAME}?start=${session}`;

  const statusEl = document.getElementById('status');
  function showStatus(html, type) {
    statusEl.className = `status show ${type}`;
    statusEl.innerHTML = html;
  }

  async function checkId() {
    showStatus('⏳ جاري التحقق...', 'pending');
    try {
      const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?limit=100`);
      const data = await r.json();

      if (!data.ok) {
        showStatus('❌ خطأ من تيليجرام، تأكد من التوكن.', 'pending');
        return;
      }

      const match = [...data.result].reverse().find(
        (u) => u.message && u.message.text && u.message.text.includes(session)
      );

      if (match) {
        const chatId = match.message.chat.id;
        localStorage.setItem('madarEDU_telegram_id', chatId);
        showStatus(
          `✅ تم تسجيل الدخول بنجاح<br>معرّفك (ID): <span class="uid">${chatId}</span>`,
          'success'
        );
      } else {
        showStatus('⚠️ لسه محدّش ضغط Start في البوت. افتح البوت واضغط Start ثم جرّب تاني.', 'pending');
      }
    } catch (e) {
      showStatus('❌ حصل خطأ في الاتصال، جرّب تاني.', 'pending');
    }
  }

  document.getElementById('checkBtn').addEventListener('click', checkId);

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('madarEDU_telegram_id');
    if (saved) {
      showStatus(`✅ مسجّل دخول بالفعل<br>معرّفك (ID): <span class="uid">${saved}</span>`, 'success');
    }
  });
</script>
</body>
</html>
