<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار API تليجرام - منصة مدار</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 24px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--primary);
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        .config-box {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid #cbd5e1;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 24px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.danger {
            background: var(--error);
        }

        button.danger:hover {
            background: #b91c1c;
        }

        button.secondary {
            background: #475569;
        }

        button.secondary:hover {
            background: #334155;
        }

        .response-box {
            background: #0f172a;
            color: #38bdf8;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 250px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .telegram-btn {
            display: inline-block;
            margin-top: 10px;
            background: #0088cc;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            text-align: center;
        }

        .telegram-btn:hover {
            background: #006699;
        }

        #linkContainer {
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>أداة اختبار API ربط التليجرام (مدار)</h1>

    <!-- إعدادات الاتصال -->
    <div class="config-box">
        <div class="form-group">
            <label>رابط الـ API الأساسي (Base URL)</label>
            <input type="text" id="baseUrl" value="https://your-domain.vercel.app" placeholder="https://your-domain.vercel.app">
        </div>
        <div class="form-group">
            <label>مفتاح الـ API (PLATFORM_API_KEY)</label>
            <input type="password" id="apiKey" placeholder="أدخل مفتاح PLATFORM_API_KEY الخاص بك">
        </div>
    </div>

    <!-- كود المستخدم والرسالة -->
    <div class="form-group">
        <label>رمز المستخدم (Platform User Code)</label>
        <input type="text" id="userCode" value="MADAR-84721" placeholder="مثال: MADAR-101">
    </div>

    <div class="form-group">
        <label>الرسالة المراد إرسالها (اختباري)</label>
        <textarea id="message" rows="2" placeholder="اكتب رسالة الإشعار هنا...">أهلاً بك! هذا إشعار تجريبي من منصة مدار.</textarea>
    </div>

    <!-- أزرار العمليات -->
    <div class="actions">
        <button onclick="createLink()">1. إنشاء رابط ربط</button>
        <button onclick="checkStatus()" class="secondary">2. فحص حالة الربط</button>
        <button onclick="sendMessage()">3. إرسال إشعار</button>
        <button onclick="unlinkUser()" class="danger">4. فك الربط</button>
    </div>

    <!-- زر التليجرام المباشر -->
    <div id="linkContainer">
        <a id="telegramLink" href="#" target="_blank" class="telegram-btn">🚀 اضغط هنا للفتح في تليجرام للربط</a>
    </div>

    <!-- عرض الاستجابة -->
    <div class="form-group" style="margin-top: 20px;">
        <label>استجابة السيرفر (API Response):</label>
        <div id="response" class="response-box">// اختر إحدى العمليات أعلاه للاختبار...</div>
    </div>
</div>

<script>
    function getHeaders() {
        const apiKey = document.getElementById('apiKey').value.trim();
        return {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
        };
    }

    function getBaseUrl() {
        let url = document.getElementById('baseUrl').value.trim();
        if (url.endsWith('/')) {
            url = url.slice(0, -1);
        }
        return url;
    }

    function showResponse(data) {
        document.getElementById('response').textContent = JSON.stringify(data, null, 2);
    }

    // 1. إنشاء رابط الربط (يتحقق من الربط المسبق)
    async function createLink() {
        const baseUrl = getBaseUrl();
        const userCode = document.getElementById('userCode').value.trim();
        document.getElementById('linkContainer').style.display = 'none';

        try {
            const res = await fetch(`${baseUrl}/api/telegram/link-create`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ platform_user_code: userCode })
            });
            const data = await res.json();
            showResponse(data);

            if (data.success && data.link_url) {
                const tgBtn = document.getElementById('telegramLink');
                tgBtn.href = data.link_url;
                document.getElementById('linkContainer').style.display = 'block';
            }
        } catch (err) {
            showResponse({ error: 'Failed to connect', details: err.message });
        }
    }

    // 2. فحص حالة الربط
    async function checkStatus() {
        const baseUrl = getBaseUrl();
        const userCode = document.getElementById('userCode').value.trim();

        try {
            const res = await fetch(`${baseUrl}/api/telegram/link-status?platform_user_code=${encodeURIComponent(userCode)}`, {
                method: 'GET',
                headers: getHeaders()
            });
            const data = await res.json();
            showResponse(data);
        } catch (err) {
            showResponse({ error: 'Failed to connect', details: err.message });
        }
    }

    // 3. إرسال إشعار
    async function sendMessage() {
        const baseUrl = getBaseUrl();
        const userCode = document.getElementById('userCode').value.trim();
        const msg = document.getElementById('message').value.trim();

        try {
            const res = await fetch(`${baseUrl}/api/telegram/send`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({
                    platform_user_code: userCode,
                    message: msg
                })
            });
            const data = await res.json();
            showResponse(data);
        } catch (err) {
            showResponse({ error: 'Failed to connect', details: err.message });
        }
    }

    // 4. فك الربط
    async function unlinkUser() {
        const baseUrl = getBaseUrl();
        const userCode = document.getElementById('userCode').value.trim();

        try {
            const res = await fetch(`${baseUrl}/api/telegram/unlink`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ platform_user_code: userCode })
            });
            const data = await res.json();
            showResponse(data);
        } catch (err) {
            showResponse({ error: 'Failed to connect', details: err.message });
        }
    }
</script>

</body>
</html>
