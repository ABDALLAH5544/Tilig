<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ربط Telegram | مدار</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 22px;
      padding: 32px 25px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .telegram {
      width: 85px;
      height: 85px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    h1 {
      margin: 0 0 10px;
      color: #222;
      font-size: 27px;
    }

    p {
      color: #666;
      line-height: 1.8;
      margin-bottom: 22px;
    }

    .code {
      background: #f1f3f6;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #333;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 13px;
      background: #229ed9;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      display: none;
      line-height: 1.7;
    }

    .loading {
      display: block !important;
      background: #f1f3f6;
      color: #555;
    }

    .success {
      display: block !important;
      background: #e8f8ee;
      color: #16803c;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #c62828;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="telegram">✈</div>

    <h1>ربط Telegram</h1>

    <p>
      اربط حسابك في منصة مدار بحساب Telegram
      لاستقبال الإشعارات والتنبيهات مباشرة.
    </p>

    <div class="code">
      حساب مدار:
      <span id="userCode"></span>
    </div>

    <button id="connectButton">
      🔗 ربط حساب Telegram
    </button>

    <div id="status"></div>

  </div>


  <script>

    // ==========================================
    // إعدادات التجربة
    // ==========================================

    const PLATFORM_USER_CODE = "MADAR-84721";

    const PLATFORM_API_KEY =
      "MadarPlatformAPI_2026_X7kP4mN8qR2vT6";

    const API_URL =
      "https://madar-telegram.vercel.app";


    // ==========================================
    // عناصر الصفحة
    // ==========================================

    const userCode =
      document.getElementById("userCode");

    const button =
      document.getElementById("connectButton");

    const status =
      document.getElementById("status");


    userCode.textContent =
      PLATFORM_USER_CODE;


    // ==========================================
    // عرض الحالة
    // ==========================================

    function showStatus(message, type) {

      status.textContent = message;

      status.className = type;

    }


    // ==========================================
    // إنشاء رابط Telegram
    // ==========================================

    button.addEventListener("click", async () => {

      button.disabled = true;

      showStatus(
        "جاري إنشاء رابط Telegram...",
        "loading"
      );


      try {

        const response = await fetch(
          API_URL + "/api/telegram/link-create",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",

              "Authorization":
                "Bearer " + PLATFORM_API_KEY
            },

            body: JSON.stringify({
              platform_user_code:
                PLATFORM_USER_CODE
            })
          }
        );


        const data =
          await response.json();


        console.log("API Response:", data);


        if (!response.ok || !data.success) {

          throw new Error(
            data.error ||
            "فشل إنشاء رابط Telegram"
          );

        }


        showStatus(
          "تم إنشاء الرابط، جاري فتح Telegram...",
          "success"
        );


        // فتح Telegram
        window.location.href =
          data.link_url;


      } catch (error) {

        console.error(error);


        showStatus(
          error.message ||
          "حدث خطأ أثناء الاتصال بالخادم",
          "error"
        );


        button.disabled = false;

      }

    });

  </script>

</body>
</html>
