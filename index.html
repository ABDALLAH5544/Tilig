<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدار EDU — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B3D2E;
    --ink-deep:#082B21;
    --parchment:#F3EBD8;
    --parchment-soft:#FBF7EC;
    --gold:#C9A227;
    --gold-bright:#E4C158;
    --line: rgba(201,162,39,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal', sans-serif;
    background: radial-gradient(circle at 20% 10%, #0E4A38 0%, var(--ink) 45%, var(--ink-deep) 100%);
    color: var(--parchment);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    padding: 24px;
  }

  /* subtle geometric star pattern, drawn once with SVG background */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, var(--line) 0, transparent 50%),
      radial-gradient(1px 1px at 80% 15%, var(--line) 0, transparent 50%),
      radial-gradient(1px 1px at 60% 70%, var(--line) 0, transparent 50%),
      radial-gradient(1px 1px at 30% 85%, var(--line) 0, transparent 50%),
      radial-gradient(1px 1px at 90% 60%, var(--line) 0, transparent 50%);
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 440px;
    background: var(--parchment-soft);
    color: var(--ink-deep);
    border-radius: 18px;
    padding: 44px 36px 36px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px var(--line);
    text-align:center;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .eyebrow{
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--gold);
    font-weight:700;
    margin-bottom: 6px;
  }

  h1{
    font-family:'Amiri', serif;
    font-size: 34px;
    margin: 0 0 8px;
    color: var(--ink-deep);
  }
  h1 span{ color:#0E4A38; }

  .sub{
    font-size:15px;
    line-height:1.7;
    color:#4a4536;
    margin: 0 0 28px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin: 26px 0;
    color:#9c8f66;
    font-size:12px;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  #telegram-login-wrap{
    display:flex;
    justify-content:center;
    min-height: 44px;
    margin-bottom: 6px;
  }

  .bot-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top: 18px;
    padding: 12px 20px;
    border-radius: 10px;
    background: var(--ink-deep);
    color: var(--parchment);
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    transition: transform .15s ease, background .2s ease;
  }
  .bot-link:hover{ background:#0E4A38; transform: translateY(-1px); }

  .status{
    margin-top: 22px;
    border-radius: 12px;
    padding: 16px;
    font-size: 14px;
    line-height:1.8;
    display:none;
  }
  .status.show{ display:block; animation: rise .4s ease both; }
  .status.success{
    background: #E9F3EA;
    border: 1px solid #9CC9A1;
    color: #1D5C2A;
  }
  .status .uid{
    font-family: monospace;
    font-weight:700;
    background: rgba(0,0,0,0.06);
    padding: 2px 8px;
    border-radius: 6px;
    display:inline-block;
    margin-top:4px;
  }

  .foot{
    margin-top:28px;
    font-size:12px;
    color:#8a8368;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow">منصّة مدار التعليمية</div>
    <h1>مدار <span>EDU</span></h1>
    <p class="sub">سجّل الدخول عبر حساب تيليجرام الخاص بك لربط حسابك ببوت المنصة والوصول إلى محتواك التعليمي.</p>

    <div id="telegram-login-wrap">
      <!-- Telegram Login Widget -->
      <script async src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="madarEDUbot"
        data-size="large"
        data-radius="10"
        data-onauth="onTelegramAuth(user)"
        data-request-access="write">
      </script>
    </div>

    <div id="status" class="status success">
      ✅ تم تسجيل الدخول بنجاح
      <div>معرّفك (Telegram ID): <span class="uid" id="uid"></span></div>
    </div>

    <div class="divider">أو</div>

    <a class="bot-link" href="https://t.me/madarEDUbot" target="_blank" rel="noopener">
      فتح بوت madarEDUbot مباشرة
    </a>

    <div class="foot">لن نشارك بياناتك مع أي جهة خارجية</div>
  </div>

<script>
  function showStatus(user) {
    const statusEl = document.getElementById('status');
    const uidEl = document.getElementById('uid');
    uidEl.textContent = user.id;
    statusEl.classList.add('show');
  }

  function onTelegramAuth(user) {
    // user = { id, first_name, last_name, username, photo_url, auth_date, hash }
    // chat_id الخاص بالمستخدم في محادثة خاصة = نفس user.id
    localStorage.setItem('madarEDU_telegram_user', JSON.stringify(user));
    showStatus(user);
  }

  // لو المستخدم سجل دخول قبل كده، نعرض حالته تلقائيًا بدون سيرفر
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('madarEDU_telegram_user');
    if (saved) {
      try { showStatus(JSON.parse(saved)); } catch (e) {}
    }
  });
</script>

</body>
</html>
